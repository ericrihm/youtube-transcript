<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Transcript Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>YouTube Transcript Saver</h1>
      <p id="status">Ready.</p>

      <label for="languageSelect">Language</label>
      <div class="row">
        <select id="languageSelect" disabled>
          <option value="auto">(auto)</option>
        </select>
        <button id="detectBtn" type="button">Detect</button>
      </div>

      <button id="saveBtn" type="button">Save Transcript as .txt</button>
      <p class="hint">Open a YouTube video tab first.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
